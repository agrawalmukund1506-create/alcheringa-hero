<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcheringa 50 Days</title>
<style>
  /* One deliberate look: the hero's own maroon, the same in light and dark viewers. */
  :root { --page: #600909; color-scheme: dark; }
  html, body { margin: 0; background: var(--page); }

  /* The Figma frame is 1440 × 2130; the stage keeps that coordinate system and is scaled to the window width. */
  .hero { position: relative; width: 100%; overflow: hidden; height: calc(100vw * 2130 / 1440); }
  .stage { position: absolute; left: 0; top: 0; width: 1440px; height: 2130px; overflow: hidden; transform-origin: 0 0; }
  .stage > img, .layer { position: absolute; display: block; }
  .stage > .bg { left: 0; top: 0; width: 1440px; height: 2130px; }
  .layer { overflow: visible; }

  /* "Get your merch" ticker — content slides left → right forever */
  .merch { position: absolute; left: 0; top: 0; width: 1440px; height: 32px; background: #F1B018; overflow: hidden; }
  .merch-track { display: flex; width: 3108px; animation: merch 28s linear infinite; will-change: transform; }
  .merch-tile { flex: none; display: block; }
  @keyframes merch { from { transform: translateX(-1554px); } to { transform: translateX(0); } }

  /* Red rays — slow clockwise turn about the point where they meet */
  .rays-spin { transform-box: view-box; transform-origin: 681px 432px; animation: spin 150s linear infinite; }

  /* Dark glow at the bottom of the hero (Figma "Ellipse 296": soft light, 62%, layer blur 124) */
  .glow { position: absolute; left: -144px; top: 1761px; width: 1819px; height: 557px; border-radius: 50%;
          background: #000; opacity: .62; filter: blur(62px); mix-blend-mode: soft-light; }

  /* Spin-the-wheel discs — very slow clockwise turn about their centre */
  /* pivot = centre of the wheel's disc (Ellipse 286), not the frame box, so it doesn't wobble */
  .wheel { transform-origin: 381.14px 383.55px; animation: spin 90s linear infinite; will-change: transform; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Music notes — slow, slight wiggle */
  .note { transform-origin: 50% 60%; animation: wiggle 6s ease-in-out infinite; }
  .n1 { animation-duration: 6.4s; animation-delay: -1.2s; }
  .n2 { animation-duration: 7.2s; animation-delay: -3.1s; }
  .n3 { animation-duration: 6.8s; animation-delay: -4.6s; }
  .n4 { animation-duration: 5.6s; animation-delay: -2.2s; }
  .n5 { animation-duration: 7.6s; animation-delay: -0.4s; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-3.5deg) translateY(0); }
    50%      { transform: rotate(3.5deg) translateY(-4px); }
  }

  /* Flying cards — suspended, hovering in the air */
  .card { animation: hover 8s ease-in-out infinite; will-change: transform; }
  .c0 { animation-duration: 9s;   animation-delay: -2s; }
  .c1 { animation-duration: 8.4s; animation-delay: -5.5s; }
  .c2 { animation-duration: 10s;  animation-delay: -1s; }
  .c3 { animation-duration: 7.6s; animation-delay: -3.8s; }
  @keyframes hover {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    25%      { transform: translate3d(12px, -34px, 0) rotate(4deg); }
    55%      { transform: translate3d(-6px, -52px, 0) rotate(-2.5deg); }
    80%      { transform: translate3d(-12px, -20px, 0) rotate(-4.5deg); }
  }

  /* Slot machine lever — click (or Enter / Space) to pull it and spin the cards */
  .slotfx { pointer-events: none; }
  .lever { pointer-events: auto; cursor: pointer; outline: none; }
  .lever.busy { cursor: default; }
  .lever:focus-visible .lever-hit { stroke: #F1B018; stroke-width: 4; stroke-dasharray: 10 8; }

  /* Slot machine buttons and cards */
  .slotfx .btn, .slotfx .card-hit { pointer-events: auto; cursor: pointer; outline: none; }
  .btn .btn-top { transition: transform .12s ease-out, filter .12s; }
  .btn:hover .btn-top { transform: translateY(-3px); filter: brightness(1.12); }
  .btn:active .btn-top, .btn.pressed .btn-top { transform: translateY(9px); filter: brightness(.95); transition-duration: .05s; }
  .btn:focus-visible .btn-top { filter: brightness(1.2); }
  /* a light sweeps across a card on hover */
  .card-hit .shine { transform: translateX(-440px); }
  .card-hit:hover .shine { transform: translateX(440px); transition: transform .9s ease-in-out; }
  .card-hit:focus-visible .hit { stroke: #F1B018; stroke-width: 4; stroke-dasharray: 10 8; }

  /* ===== EXTRAS: surprise interactions (delete this block with the EXTRAS script to remove them) ===== */
  .stage > .logo, .stage > .slot, .layer.clown { pointer-events: none; }
  .layer.clown .extra-poke { pointer-events: all; cursor: pointer; }
  .note, .wheel { cursor: pointer; }
  /* ===== END EXTRAS ===== */

  @media (prefers-reduced-motion: reduce) {
    .merch-track, .wheel, .note, .card, .rays-spin { animation: none; }
  }
</style>
</head>

<script>
(() => {
  // ---- scale the 1440px stage to the window ----
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = stage.parentElement.clientWidth / 1440;
    stage.style.transform = `scale(${s})`;
    stage.parentElement.style.height = `${2130 * s}px`;    // exact, even when a scrollbar narrows the page
  };
  addEventListener('resize', fit); fit();

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const box = el => el.getBBox();
  const measure = id => box(document.querySelector(`#measure use[href="#${id}"]`));

  // ---- joker eyes: two slot-machine reels ----
  // Motion measured from the reference clip: reels jump to speed in ~0.2s, spin ~3.5s,
  // brake over ~0.45s while sliding a third of a digit past the mark, then spring back into place.
  const PITCH = 175;           // spacing between digits on a reel (taller than the eye, so one digit shows)
  const ACCEL = 0.2;           // seconds to reach top speed
  const BRAKE = 0.45;          // seconds of braking, ending at the overshoot peak
  const OVERSHOOT = 0.35;      // how far past the final digit the reel slides, in digits
  const SETTLE = 0.25;         // seconds to spring back onto the final digit
  const BLUR_SPEED = 14;       // speed (digits/s) that gets full motion blur
  const easeInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

  // Position (in items) and speed of a reel at time t since it started. It covers `steps` items,
  // reaching the overshoot peak `spin` seconds in, then springs back onto the last item.
  function reelMotion(steps, spin, overshoot) {
    // top speed chosen so the reel covers exactly steps + overshoot by the end of the brake
    const cruise = spin - ACCEL - BRAKE;
    const vmax = (steps + overshoot) / (ACCEL / 2 + cruise + BRAKE / 2);
    const at = t => {
      if (t <= 0) return [0, 0];
      if (t < ACCEL) return [vmax * t * t / (2 * ACCEL), vmax * t / ACCEL];
      const p0 = vmax * ACCEL / 2;
      t -= ACCEL;
      if (t < cruise) return [p0 + vmax * t, vmax];
      const p1 = p0 + vmax * cruise;
      t -= cruise;
      if (t < BRAKE) { const u = t / BRAKE; return [p1 + vmax * BRAKE * (u - u * u / 2), vmax * (1 - u)]; }
      t -= BRAKE;
      if (t < SETTLE) { const u = t / SETTLE; return [steps + overshoot * (1 - easeInOut(u)), 0]; }
      return [steps, 0];
    };
    return { at, total: spin + SETTLE };
  }

  // The digits sit on a drum: they roll round it, squashing as they turn toward the top and bottom
  // of the eye. The eyes are curved panels (flat along the bottom, rounding away at the outer top
  // corner), so the digits are also warped to follow each panel's curve.
  const DRUM_STEP = 70 * Math.PI / 180;    // angle between neighbouring digits on the drum
  const DRUM_R = PITCH / DRUM_STEP;        // drum radius, so digits cross the middle at reel speed
  const WARP = 0.4;                        // how strongly the digits follow the panel (0 = flat)

  // A displacement map (drawn on a canvas) that squeezes each column of the eye toward that
  // column's own height and middle, so the digits bend with the panel's outline.
  function eyeWarp(side, eyePath, cy) {
    const b = eyePath.getBBox();
    const x0 = Math.floor(b.x) - 10, y0 = Math.floor(b.y) - 10;
    const W = Math.ceil(b.width) + 20, H = Math.ceil(b.height) + 20;
    const svg = eyePath.ownerSVGElement, pt = svg.createSVGPoint();
    const cols = [];
    let hmax = 0;
    for (let x = 0; x < W; x++) {
      let top = null, bot = null;
      for (let y = 0; y < H; y++) {
        pt.x = x0 + x + .5; pt.y = y0 + y + .5;
        if (eyePath.isPointInFill(pt)) { if (top === null) top = pt.y; bot = pt.y; }
      }
      cols.push(top === null ? null : [top, bot]);
      if (top !== null) hmax = Math.max(hmax, bot - top);
    }
    for (let x = 0; x < W; x++) if (!cols[x]) cols[x] = cols[x - 1] || cols.find(Boolean);   // edges: nearest column
    const dys = new Float32Array(W * H);
    let maxD = 1;
    for (let x = 0; x < W; x++) {
      const [top, bot] = cols[x];
      const s = 1 - WARP * (1 - (bot - top) / hmax);           // this column's squeeze
      const mid = cy + WARP * ((top + bot) / 2 - cy);         // ...and where its middle sits
      for (let y = 0; y < H; y++) {
        const py = y0 + y + .5;
        // read the flat digit from here (capped: rows far outside the eye are clipped anyway, and a
        // smaller range keeps the 8-bit map precise)
        const dy = Math.max(-45, Math.min(45, cy + (py - mid) / s - py));
        dys[y * W + x] = dy; maxD = Math.max(maxD, Math.abs(dy));
      }
    }
    const scale = Math.ceil(maxD * 2 + 2);
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    const g = canvas.getContext('2d'), img = g.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      img.data[i * 4] = 128;                                                 // no sideways shift
      img.data[i * 4 + 1] = Math.round(255 * (dys[i] / scale + .5));
      img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    // rebuild the reel's filter as: warp, then the vertical motion blur
    const NS = 'http://www.w3.org/2000/svg';
    const filter = document.getElementById('reelBlur' + side);
    const region = { x: x0, y: y0, width: W, height: H };
    for (const [k, v] of Object.entries(region)) filter.setAttribute(k, v);
    filter.setAttribute('filterUnits', 'userSpaceOnUse');
    filter.setAttribute('primitiveUnits', 'userSpaceOnUse');
    filter.setAttribute('color-interpolation-filters', 'sRGB');
    const map = document.createElementNS(NS, 'feImage');
    for (const [k, v] of Object.entries(region)) map.setAttribute(k, v);
    map.setAttribute('href', canvas.toDataURL());
    map.setAttribute('preserveAspectRatio', 'none');
    map.setAttribute('result', 'map');
    const warp = document.createElementNS(NS, 'feDisplacementMap');
    Object.entries({ in: 'SourceGraphic', in2: 'map', scale, xChannelSelector: 'R', yChannelSelector: 'G' })
      .forEach(([k, v]) => warp.setAttribute(k, v));
    filter.prepend(map, warp);
  }

  // spin = seconds from start until the overshoot peak
  function makeReel(side, from, to, turns, delay, spin) {
    const reel = document.getElementById('reel' + side);
    const strip = reel.querySelector('.strip');
    const shade = reel.querySelector('.reel-shade');
    const blur = document.querySelector(`#reelBlur${side} feGaussianBlur`);
    const orig = measure('orig' + side);
    const scale = orig.height / measure(`g${side}${from}`).height;
    const cx = orig.x + orig.width / 2, cy = orig.y + orig.height / 2;
    const steps = turns * 10 + ((to - from + 10) % 10);
    const NS = 'http://www.w3.org/2000/svg';
    const items = [];
    for (let i = 0; i <= steps + 1; i++) {
      const d = (from + i) % 10, b = measure(`g${side}${d}`);
      const u = document.createElementNS(NS, 'use');
      u.setAttribute('href', `#g${side}${d}`);
      u.style.display = 'none';
      strip.appendChild(u);
      items.push({ u, bx: b.x + b.width / 2, by: b.y + b.height / 2 });
    }
    strip.setAttribute('filter', `url(#reelBlur${side})`);
    eyeWarp(side, document.querySelector(`#c-Vector_${side === 'L' ? 126 : 146} path`), cy);
    const { at, total } = reelMotion(steps, spin, OVERSHOOT);
    let shown = [];
    function draw(pos, speed) {
      // only the digits on the visible front of the drum are drawn
      const next = [];
      for (let i = Math.max(0, Math.floor(pos - 1.3)); i <= Math.min(items.length - 1, Math.ceil(pos + 1.3)); i++) {
        const phi = (pos - i) * DRUM_STEP;
        if (Math.abs(phi) >= Math.PI / 2) continue;
        const it = items[i];
        it.u.setAttribute('transform', `translate(${cx} ${(cy + DRUM_R * Math.sin(phi)).toFixed(2)}) ` +
          `scale(${scale} ${(scale * Math.cos(phi)).toFixed(4)}) translate(${-it.bx} ${-it.by})`);
        it.u.style.display = '';
        next.push(it);
      }
      for (const it of shown) if (!next.includes(it)) it.u.style.display = 'none';
      shown = next;
      const s = Math.min(Math.abs(speed) / BLUR_SPEED, 1);
      blur.setAttribute('stdDeviation', `0 ${(s * 10).toFixed(2)}`);
      shade.style.opacity = (s * 0.9).toFixed(3);
    }
    draw(0, 0);
    return { delay, total, at, draw, steps, spin, last: 0, stopped: false };
  }

  // the eyes spin two full turns (about 2.6s in all) and land back on 5 and 0; the left lands a beat behind
  const reels = [makeReel('L', 5, 5, 2, 0.4, 2.0), makeReel('R', 0, 0, 2, 0.4, 1.9)];

  // ---- jester cap: two halves, each pinned where it meets the head ----
  // The red half and the black & white half rock about the point where they join the top of the
  // head, at the same time and by the same amount but in opposite directions (mirror images).
  // Further down each half, every joint repeats the motion a little later and a little bigger,
  // like soft fabric with a weight on the end.
  const CAP_PIVOT = [401, 207];          // bottom of the seam between the halves, on top of the head
  const CAP_AMP = 4;                     // degrees
  const CAP_PERIOD = 4.6;                // seconds per rock
  const halfAngle = (h, t) => {          // two mixed sines so the rocking never looks mechanical
    const w = 2 * Math.PI / CAP_PERIOD;
    return h.dir * CAP_AMP * (0.8 * Math.sin(w * t) + 0.2 * Math.sin(2.3 * w * t + 0.7));
  };
  const LINKS = [                        // gain = how much more than its half it swings; lag in seconds
    { cls: 'tail',  gain: 1.4,  lag: 0.3 },    // the bend hidden behind the logo
    { cls: 'ball',  gain: 1.7,  lag: 0.45 },   // the bells trail last
  ];
  const halves = {                       // dir: +1 / -1 mirrors the motion; joint pivots are mirrored too
    L: { dir: 1,  pivots: [[210, 640], [120, 655]] },   // red
    R: { dir: -1, pivots: [[590, 640], [695, 655]] },   // black & white
  };
  for (const [side, h] of Object.entries(halves)) {
    h.caps = [...document.querySelectorAll(`.cap${side}`)];
    h.links = LINKS.map(l => [...document.querySelectorAll(`.${l.cls}${side}`)]);
  }

  // ---- sound: synthesised with Web Audio, so there are no files to load ----
  // The audio context is only created inside a click (browsers block sound before one).
  const sound = (() => {
    let ctx = null, out = null, noise = null;
    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      out = ctx.createGain(); out.gain.value = 0.6; out.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    }
    const env = (t, peak, dur) => {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(out);
      return g;
    };
    // a short filtered noise burst: ratchet teeth, reel ticks
    function click(t, freq, peak, dur = 0.03) {
      const src = ctx.createBufferSource(); src.buffer = noise;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 6;
      src.connect(bp).connect(env(t, peak, dur));
      src.start(t, Math.random() * 0.4, dur + 0.02);
    }
    // a dull mechanical knock: a falling sine plus a low noise thump
    function thunk(t, freq, peak) {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.45, t + 0.18);
      o.connect(env(t, peak, 0.28)); o.start(t); o.stop(t + 0.3);
      click(t, freq * 4, peak * 0.5, 0.06);
    }
    return {
      init,
      get ready() { return !!ctx; },
      // actually audible: browsers keep the context suspended until the visitor interacts
      get running() { return !!ctx && ctx.state === 'running'; },
      // lever pull: ratchet teeth closing up as it speeds down, then the clunk at the bottom
      pull(dur) {
        const t = ctx.currentTime;
        [0, .42, .66, .8, .89, .95].forEach((f, i) => click(t + f * dur, 2600 - i * 180, 0.35));
        thunk(t + dur, 110, 0.9);
      },
      tick() { click(ctx.currentTime, 3000 + Math.random() * 900, 0.16, 0.025); },
      // a chunky arcade button: a click on the way down and a soft knock as it bottoms out
      button() { const t = ctx.currentTime; click(t, 1900, 0.3, 0.02); thunk(t + 0.015, 230, 0.35); },
      stop() { thunk(ctx.currentTime, 170, 0.6); },
      // the spring sending the lever back up: a quick rising twang, then a knock at the top
      release(dur) {
        const t = ctx.currentTime;
        const o = ctx.createOscillator(); o.type = 'triangle';
        o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(520, t + dur * 0.5);
        const wob = ctx.createOscillator(), wobAmt = ctx.createGain();
        wob.frequency.value = 22; wobAmt.gain.value = 30; wob.connect(wobAmt).connect(o.frequency);
        o.connect(env(t, 0.22, dur * 0.8)); o.start(t); wob.start(t); o.stop(t + dur); wob.stop(t + dur);
        thunk(t + dur * 0.45, 95, 0.55);
      },
      ctx: () => ctx, out: () => out,
    };
  })();

  // ---- slot machine: click the lever to pull it down and spin the three cards ----
  // The lever turns toward the viewer about its hub (Figma "Handle up" → "handle down"): the rod is
  // foreshortened by cos(angle), passes behind the hub and comes out below it with the ball hanging down.
  // Coordinates are the slot machine overlay's (slot.svg's) own.
  const lever = document.getElementById('lever');
  const rod = lever.querySelector('.rod');
  const ball = lever.querySelector('.ball');
  const HUB_Y = 762.55;                  // centre of the hub: the lever's pivot
  const BALL = [1209.7, 339.85];         // ball centre with the lever up
  const DOWN = 114;                      // degrees the lever turns to reach "handle down"
  const PULL = 0.35, BOUNCE = 0.18, RELEASE = 0.6;   // seconds
  const REEL_START = 0.3;                // cards start spinning as the lever hits the bottom
  const CARD_PITCH = 470;                // card + shadow + a gap
  const CARD_OVERSHOOT = 0.25;           // in cards
  const CARD_BLUR_SPEED = 9;             // cards/s that gets full motion blur
  const ART = { logo: 'assets/card-logo.svg', soon: 'assets/card-soon.svg' };
  // [design in the window, cards passed (even, so each lands on its own design), seconds to the stop]
  const CARD_REELS = [['logo', 12, 1.5], ['soon', 14, 1.9], ['logo', 16, 2.3]];
  const NUDGE_STEPS = 6, NUDGE_SPIN = 0.95;    // a single card clicked on its own: shorter, quicker
  const HOVER_TIP = 9;                         // degrees the lever tips toward you on hover
  const easeIn = u => u * u * u;
  const easeOut = u => 1 - Math.pow(1 - u, 3);
  const easeOutBack = u => 1 + 2.4 * Math.pow(u - 1, 3) + 1.4 * Math.pow(u - 1, 2);

  const cardReels = CARD_REELS.map(([own, steps, spin], i) => {
    const el = document.getElementById('cardReel' + i);
    const strip = el.querySelector('.strip');
    const win = el.querySelector('rect');
    const x = +win.getAttribute('x'), y = +win.getAttribute('y');
    const other = own === 'logo' ? 'soon' : 'logo';
    for (let j = 0; j <= steps + 1; j++) {
      const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.setAttribute('href', ART[j % 2 ? other : own]);
      img.setAttribute('x', x); img.setAttribute('y', y - j * CARD_PITCH);
      img.setAttribute('width', 316); img.setAttribute('height', 436);
      strip.appendChild(img);
    }
    const blur = document.querySelector(`#cardBlur${i} feGaussianBlur`);
    const shade = el.querySelector('.reel-shade');
    const draw = (pos, speed) => {
      strip.setAttribute('transform', `translate(0 ${pos * CARD_PITCH})`);
      const s = Math.min(Math.abs(speed) / CARD_BLUR_SPEED, 1);
      blur.setAttribute('stdDeviation', `0 ${(s * 16).toFixed(2)}`);
      shade.style.opacity = (s * 0.9).toFixed(3);
    };
    return {
      el, draw, busy: false,
      full: reelMotion(steps, spin, CARD_OVERSHOOT),                // with the lever
      nudge: reelMotion(NUDGE_STEPS, NUDGE_SPIN, CARD_OVERSHOOT),   // clicking the card on its own
    };
  });

  // Spin one card reel through `motion`, starting `delay` seconds from now; resolves once it has landed.
  // The reel is drawn over its static card only while it moves.
  function spinReel(r, motion, delay, audio) {
    r.busy = true;
    return new Promise(done => {
      let start = null, last = 0, braked = false;
      function step(now) {
        if (start === null) start = now;
        const t = (now - start) / 1000 - delay;
        if (t >= motion.total) { r.el.style.display = 'none'; r.busy = false; done(); return; }
        if (t > 0) {
          r.el.style.display = '';
          const [p, v] = motion.at(t);
          r.draw(p, v);
          // a tick each time a card passes the window, a thunk as the reel brakes onto its card
          if (audio && Math.floor(p) !== last) { last = Math.floor(p); sound.tick(); }
          if (audio && !braked && t >= motion.total - SETTLE) { braked = true; sound.stop(); }
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function poseLever(deg) {
    const c = Math.cos(deg * Math.PI / 180);
    rod.setAttribute('transform', `translate(0 ${HUB_Y}) scale(1 ${c.toFixed(4)}) translate(0 ${-HUB_Y})`);
    // the ball swings toward the viewer on the way down, so it looks a touch bigger mid-pull
    const s = 1 + 0.1 * Math.sin(Math.PI * Math.min(Math.max(deg, 0), DOWN) / DOWN);
    const cy = HUB_Y - c * (HUB_Y - BALL[1]);
    ball.setAttribute('transform', `translate(${BALL[0]} ${cy.toFixed(2)}) scale(${s.toFixed(4)}) translate(${-BALL[0]} ${-BALL[1]})`);
  }

  // hovering the lever tips it a few degrees toward you, inviting a pull
  let pulling = false, hoverDeg = 0, hoverTarget = 0, hoverRaf = 0;
  function hoverTo(target) {
    hoverTarget = target;
    cancelAnimationFrame(hoverRaf);
    (function ease() {
      if (pulling) return;
      hoverDeg += (hoverTarget - hoverDeg) * 0.2;
      if (Math.abs(hoverTarget - hoverDeg) < 0.05) hoverDeg = hoverTarget;
      poseLever(hoverDeg);
      if (hoverDeg !== hoverTarget) hoverRaf = requestAnimationFrame(ease);
    })();
  }
  lever.addEventListener('pointerenter', () => hoverTo(HOVER_TIP));
  lever.addEventListener('pointerleave', () => hoverTo(0));

  function pull() {
    if (pulling || cardReels.some(r => r.busy)) return;
    pulling = true;
    lever.classList.add('busy');
    lever.dispatchEvent(new CustomEvent('leverpull'));
    const audio = sound.init();
    if (audio) sound.pull(PULL);
    const from = hoverDeg;                // if it was tipped by a hover, the pull carries on from there
    let start = null, releaseAt = Infinity, released = false;
    // the lever springs back up shortly after the last card lands
    Promise.all(cardReels.map(r => spinReel(r, r.full, REEL_START, audio))).then(() => {
      lever.dispatchEvent(new CustomEvent('slotstop'));
      releaseAt = (performance.now() - start) / 1000 + 0.15;
    });
    function step(now) {
      if (start === null) start = now;
      const t = (now - start) / 1000;
      if (!released && t >= releaseAt) { released = true; if (audio) sound.release(RELEASE); }
      // lever: yank down past the stop, bounce back onto it, hold while the cards spin, spring back up
      let deg;
      if (t < PULL) deg = from + (DOWN * 1.06 - from) * easeIn(t / PULL);
      else if (t < PULL + BOUNCE) deg = DOWN * (1.06 - 0.06 * easeOut((t - PULL) / BOUNCE));
      else if (t < releaseAt) deg = DOWN;
      else deg = DOWN * (1 - easeOutBack(Math.min((t - releaseAt) / RELEASE, 1)));
      poseLever(deg);
      if (t < releaseAt + RELEASE) requestAnimationFrame(step);
      else {
        poseLever(0); hoverDeg = 0;
        pulling = false; lever.classList.remove('busy');
        if (lever.matches(':hover')) hoverTo(HOVER_TIP);
      }
    }
    requestAnimationFrame(step);
  }

  // clicking a card nudges just that reel: a short spin back onto the same card
  function nudge(i) {
    const r = cardReels[i];
    if (pulling || r.busy) return;
    spinReel(r, r.nudge, 0, sound.init());
  }

  // the machine's two buttons press down onto their side faces; SPIN pulls the lever
  const press = btn => {
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 170);
    if (sound.init()) sound.button();
  };
  const btnSpin = document.getElementById('btnSpin');
  const btnSchedule = document.getElementById('btnSchedule');
  btnSpin.addEventListener('click', () => { press(btnSpin); setTimeout(pull, 90); });
  btnSchedule.addEventListener('click', () => press(btnSchedule));

  // keyboard: Enter / Space works on the lever, the SPIN button and each card
  const onKey = fn => e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } };
  lever.addEventListener('click', pull);
  lever.addEventListener('keydown', onKey(pull));
  btnSpin.addEventListener('keydown', onKey(() => btnSpin.dispatchEvent(new MouseEvent('click'))));
  document.querySelectorAll('.card-hit').forEach((el, i) => {
    el.addEventListener('click', () => nudge(i));
    el.addEventListener('keydown', onKey(() => nudge(i)));
  });

  // hooks for the optional extras further down: re-roll the eyes, and the sound engine
  let clock = 0;
  const spinEyes = () => { for (const r of reels) { r.delay = clock + 0.05; r.last = 0; r.stopped = false; } };

  // Eye-spin sound on load. Browsers only let a page make sound after the visitor interacts with it,
  // so this asks for audio straight away (some browsers allow it, e.g. for sites you visit often) and
  // otherwise switches it on at the first click, tap or key press, so the rest of the spin is heard.
  // Ticks are only played while audio is actually running, so none pile up and burst out late.
  if (!reduce) {
    sound.init();
    for (const ev of ['pointerdown', 'keydown', 'touchstart'])
      addEventListener(ev, () => sound.init(), { once: true, passive: true });
  }
  window.alcheringaHero = { sound, spinEyes, reduce };

  if (reduce) {
    reels.forEach(r => r.draw(r.steps, 0));
    return;
  }

  // the clock starts on the first painted frame, so a page opened in a background tab still shows the spin
  let t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    const t = clock = (now - t0) / 1000;
    for (const r of reels) {
      const [p, v] = r.at(t - r.delay);
      r.draw(p, v);
      // a tick for each digit that rolls past, a thunk as each eye brakes onto its number
      if (Math.floor(p) !== r.last) { r.last = Math.floor(p); if (sound.running) sound.tick(); }
      if (!r.stopped && t - r.delay >= r.spin) { r.stopped = true; if (sound.running) sound.stop(); }
    }
    for (const h of Object.values(halves)) {
      const base = halfAngle(h, t);
      const capRot = `rotate(${base.toFixed(3)} ${CAP_PIVOT[0]} ${CAP_PIVOT[1]})`;
      for (const el of h.caps) el.setAttribute('transform', capRot);
      let parent = base;
      LINKS.forEach((l, i) => {
        const angle = l.gain * halfAngle(h, t - l.lag);
        // links are nested, so each one rotates by its angle relative to the link above
        const rot = `rotate(${(angle - parent).toFixed(3)} ${h.pivots[i][0]} ${h.pivots[i][1]})`;
        for (const el of h.links[i]) el.setAttribute('transform', rot);
        parent = angle;
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<!-- ===== EXTRAS: surprise interactions. Delete from here to "END EXTRAS" (and the matching

<script>
(() => {
  const hero = window.alcheringaHero;
  if (!hero) return;
  const { sound } = hero;
  const stage = document.getElementById('stage');
  const NS = 'http://www.w3.org/2000/svg';

  // small Web Audio voices of our own, played through the page's sound engine
  function bell(freq, at = 0, peak = 0.22, dur = 1.2) {
    const ctx = sound.ctx(), t = ctx.currentTime + at;
    for (const [mult, amp] of [[1, 1], [2.76, 0.35], [5.4, 0.12]]) {     // a bell-ish partial stack
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq * mult;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * amp, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / mult ** 0.3);
      o.connect(g).connect(sound.out()); o.start(t); o.stop(t + dur);
    }
  }
  function boing() {
    const ctx = sound.ctx(), t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(520, t + 0.12);
    o.frequency.exponentialRampToValueAtTime(260, t + 0.45);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g).connect(sound.out()); o.start(t); o.stop(t + 0.55);
  }

  // 1. Depth: as the cursor moves, layers drift by different amounts (nearer ones more)
  if (!hero.reduce && matchMedia('(pointer: fine)').matches) {
    const depth = [['.rays', 5], ['.wheel', 10], ['.note', 22], ['.card', 32], ['#clown', 12]];
    const items = depth.flatMap(([sel, d]) => [...stage.querySelectorAll(sel)].map(el => ({ el, d })));
    let tx = 0, ty = 0, x = 0, y = 0;
    addEventListener('pointermove', e => { tx = e.clientX / innerWidth - 0.5; ty = e.clientY / innerHeight - 0.5; });
    document.documentElement.addEventListener('pointerleave', () => { tx = ty = 0; });
    (function drift() {
      x += (tx - x) * 0.06; y += (ty - y) * 0.06;
      for (const { el, d } of items) el.style.translate = `${(-x * d).toFixed(2)}px ${(-y * d).toFixed(2)}px`;
      requestAnimationFrame(drift);
    })();
  }

  // 2. Poke the joker: he flinches and his eyes roll again, landing back on 5 0
  const clown = document.getElementById('clown');
  const face = document.createElementNS(NS, 'ellipse');
  Object.entries({ cx: 394, cy: 388, rx: 189, ry: 185, fill: 'transparent', class: 'extra-poke' })
    .forEach(([k, v]) => face.setAttribute(k, v));
  clown.appendChild(face);
  face.addEventListener('click', () => {
    if (sound.init()) boing();
    hero.spinEyes();
    clown.animate([{ scale: '1' }, { scale: '1.04 0.95' }, { scale: '0.98 1.03' }, { scale: '1' }],
      { duration: 420, easing: 'ease-out' });
  });

  // 3. The music notes play when clicked (each its own note of a pentatonic scale) and hop
  const scale = [523.25, 659.25, 783.99, 880, 1046.5];
  stage.querySelectorAll('.note').forEach((note, i) => {
    note.addEventListener('click', () => {
      if (sound.init()) bell(scale[i % scale.length], 0, 0.25, 1.4);
      note.animate([{ scale: '1' }, { scale: '1.35' }, { scale: '0.9' }, { scale: '1' }],
        { duration: 520, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    });
  });

  // 4. Jackpot: when the cards land, a rising chime
  document.getElementById('lever').addEventListener('slotstop', () => {
    if (sound.ready) [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.09, 0.18, 1.6));
  });

  // 5. Brush past a spin wheel and it whirls, then coasts back to its slow turn
  stage.querySelectorAll('.wheel').forEach(wheel => {
    let raf = 0;
    wheel.addEventListener('pointerenter', () => {
      const anim = wheel.getAnimations()[0];
      if (!anim) return;
      cancelAnimationFrame(raf);
      const t0 = performance.now();
      (function coast(now) {
        const k = Math.min((now - t0) / 2600, 1);
        anim.playbackRate = 1 + 40 * Math.pow(1 - k, 2.5);
        if (k < 1) raf = requestAnimationFrame(coast);
      })(t0);
    });
  });
})();
</script>
